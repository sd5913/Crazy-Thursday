<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162a29"><title>表情喂食｜Crazy Thursday</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="stage">
  <video id="cam" autoplay playsinline muted></video>

  <div class="hud">
    <div class="score">SCORE <span id="score">0</span></div>
    <div class="discomfort">
      <span>DISCOMFORT</span>
      <div class="bar"><div id="discomfortFill"></div></div>
    </div>
  </div>

  <div class="scene">
    <div class="nurse" aria-hidden="true">🧑‍⚕️</div>
    <div class="spoon" id="spoon"><div class="item" id="item">🥄</div></div>
    <div class="patient" id="patient" aria-hidden="true">🛏️</div>
  </div>

  <div id="exprBadge" class="badge" data-expr="none">未检测到人脸</div>
  <div id="subtitle" class="subtitle">准备中…</div>

  <div id="overlay" class="overlay">
    <div class="panel" id="panel">
      <h1>表情喂食</h1>
      <p>用微笑接受、撇嘴拒绝、张嘴伸舌呕吐。相机只在本地处理，不上传。</p>
      <button id="startBtn" type="button">开始并校准</button>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body></html>
