<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162a29"><title>Expression Feeding · Crazy Thursday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<main class="stage">
  <img id="bg" class="bg" src="assets/bg.jpg" alt="background">

  <video id="cam" autoplay playsinline muted></video>

  <div class="hud">
    <img class="hud-bg" src="assets/hud.svg" alt="">
    <div class="game-title">Expression Feeding</div>
    <div class="score">SCORE <span id="score">0</span></div>
    <div class="discomfort">
      <span>DISCOMFORT</span>
      <div class="bar"><div id="discomfortFill"></div></div>
    </div>
  </div>

  <div id="combo" class="combo" hidden>combo ×0</div>

  <div class="scene">
    <div class="spoon" id="spoon"><img class="spoon-img" src="assets/spoon.png" alt=""><img class="item" id="item" src="assets/food/congee.svg" alt="food"></div>
  </div>

  <div id="exprBadge" class="badge" data-expr="none">no face detected</div>
  <img id="hintBubble" class="hint-bubble" src="assets/hint.svg" alt="">
  <div id="subtitle" class="subtitle">Loading…</div>

  <div id="overlay" class="overlay">
    <div class="panel" id="panel">
      <h1>Expression Feeding</h1>
      <p>Smile to accept, frown to refuse, gag to purge. The camera is processed locally and never leaves your device.</p>
      <button id="startBtn" type="button">Start &amp; Calibrate (needs camera)</button>
      <button id="demoBtn" type="button">Keyboard Demo (no camera)</button>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body></html>
